# #703 - Pruebas de política en PR, sin crear el check de publicación.
# Separado para evitar checks 'skipped' del mismo nombre en PR/main.
name: Release migration policy tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-migration-gate.yml'
      - '.github/workflows/release-migration-policy-tests.yml'
      - 'scripts/ci/release-migration-gate.mjs'
      - 'scripts/ci/release-migration-policy.mjs'
      - 'scripts/ci/__tests__/release-migration-gate.node.test.mjs'
      - 'scripts/ci/__tests__/release-migration-policy.node.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    name: Release migration policy tests (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: >-
          node --test scripts/ci/__tests__/release-migration-gate.node.test.mjs
          scripts/ci/__tests__/release-migration-policy.node.test.mjs
