name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Soak temporal del Pedido Hub V2 (Fase 10). Cada 4h dispara SOLO el job
  # `e2e-hub` (los demás jobs se saltan vía `if: github.event_name !=
  # 'schedule'`). El objetivo es medir estabilidad sostenida en el tiempo,
  # independiente del ritmo de merges. Criterio de salida: >=72h + >=18
  # ejecuciones programadas verdes (0 failed / 0 flaky / sin retries).
  # Se elimina junto con el job `e2e-hub` en F10b.
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  # `github.event_name` en el grupo: una corrida programada (soak) y una
  # corrida de push a `main` (validación de cambio) NO deben cancelarse
  # entre sí — son señales distintas y ambas deben quedar registradas.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # El cron cada 4h es exclusivamente para el soak del Hub (job `e2e-hub`).
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: |
          mkdir -p reports
          npm run test -- \
            --reporter=verbose \
            --reporter=junit \
            --outputFile.junit=reports/junit.xml 2>&1 | tee reports/test-output.log
          exit ${PIPESTATUS[0]}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/
          retention-days: 7

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint -- --max-warnings 999

  integration:
    name: Integration tests (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No bloquea merges todavía -- es la primera vez que este suite corre
    # en CI (antes solo se ejecutaba localmente contra Postgres real, si
    # el desarrollador lo hacía). Igual que Lint cuando se introdujo:
    # queda non-blocking hasta confirmar que el suite completo es estable
    # en un entorno de CI fresco, antes de promoverlo a gate obligatorio.
    continue-on-error: true
    if: github.event_name != 'schedule'

    env:
      DATABASE_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      DIRECT_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      REDIS_URL: redis://localhost:6379
      TZ: America/Bogota

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Start service containers (PostgreSQL + Redis)
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=bambu \
            -e POSTGRES_PASSWORD=bambu_dev \
            -e POSTGRES_DB=bambu \
            -p 5432:5432 \
            postgres:17.10-alpine
          docker run -d \
            --name redis \
            -p 6379:6379 \
            redis:8-alpine

          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U bambu &>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

          for i in $(seq 1 15); do
            if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            sleep 1
          done

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to CI database
        run: npx prisma db push

      - name: Apply raw-SQL sequence migrations (not covered by db push)
        # Mismo motivo/patrón que el job E2E: `prisma db push` no crea las
        # secuencias raw-SQL (factura/abono/embarque/compra_insumo numero_seq)
        # que getNextNumero() necesita. Ver comentario del job e2e para el
        # detalle completo.
        #
        # También aplica (bug #2 y #3 encontrados en la primera corrida real
        # de este job, PR #120):
        #   - pg_trgm: la extensión solo se crea vía migration.sql
        #     (20260530_add_pg_trgm_search, 20260618_add_import_staging);
        #     `db push` no ejecuta CREATE EXTENSION. Sin ella, similarity()/
        #     word_similarity() (usadas por src/lib/import/matcher.ts,
        #     supplier-matcher.ts, worker-matcher.ts) fallan con
        #     "function similarity(text, text) does not exist" — root cause
        #     de los fallos en import-historico.test.ts.
        #   - 20260817_plan_maestro_ledgers: migración consolidada e
        #     idempotente (CREATE TABLE/INDEX/CONSTRAINT IF NOT EXISTS, DO $$
        #     IF NOT EXISTS por cada CHECK/FK) que agrega, entre otras cosas,
        #     los CHECK constraints del ledger físico (chk_embarque_movimiento_*,
        #     chk_obligacion_*, chk_recovery_*) y las secuencias
        #     pedido_numero_seq/nota_credito_numero_seq — ninguna de las dos
        #     cosas es expresable en schema.prisma, así que `db push` no las
        #     crea. Root cause de los fallos en ledger-fisico-constraints.test.ts
        #     y de parte de los fallos de secuencias-atomicas.test.ts (además
        #     del bug de this-binding en sequence.ts, ya corregido aparte).
        #     Las tablas que este archivo declara con CREATE TABLE IF NOT
        #     EXISTS ya existen (creadas por `db push` desde schema.prisma),
        #     así que esos statements son no-ops aquí; solo aplican los CHECK/
        #     índices parciales/secuencias que sí son exclusivos del SQL.
        run: |
          export PGPASSWORD=bambu_dev
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'app_write') THEN
                CREATE ROLE app_write;
              END IF;
            END \$\$;
          "
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260610_add_factura_numero_seq/migration.sql
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260611_add_abono_embarque_seqs/migration.sql
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260619_import_fase2_proveedor_compra_seq/migration.sql
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260817_plan_maestro_ledgers/migration.sql
          # 20260817 (arriba) crea ReceivableEntry_offlineId_key UNIQUE; esta
          # migración posterior lo baja a índice normal (bug pagar-fiado con
          # abonos que cubren 2+ pedidos). Se aplica acá para replicar el
          # orden de `prisma migrate deploy` de prod.
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260829_receivable_entry_offlineid_not_unique/migration.sql
          # ADR-CORRECCION-MONETARIA-001 g2.1: el CHECK `chk_correccion_monto_pos`
          # y los GRANT no son expresables en schema.prisma, así que `db push`
          # no los crea. Idempotente (IF NOT EXISTS por tabla/índice/FK/CHECK).
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260901_add_correccion_abono/migration.sql
          # G5.5 (ADR-PEDIDO-ESTADO-CANONICO-001 §2): CHECK `chk_pedido_estadopago_proyectado`
          # no expresable en schema.prisma. `db push` no la crea; sin esta línea
          # los tests de `pedido-estadopago-check.test.ts` (y cualquier otro que
          # dependa del CHECK) correrían en CI sin el constraint presente.
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260905_add_pedido_estadopago_check/migration.sql

      - name: Run integration tests
        run: npm run test:integration

  e2e:
    name: E2E (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Suite legacy (V2 OFF). El cron cada 4h es solo para el soak del Hub.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    env:
      DATABASE_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      DIRECT_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      REDIS_URL: redis://localhost:6379
      AUTH_TRUST_HOST: 'true'
      TZ: America/Bogota
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Start service containers (PostgreSQL + Redis)
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=bambu \
            -e POSTGRES_PASSWORD=bambu_dev \
            -e POSTGRES_DB=bambu \
            -p 5432:5432 \
            postgres:17.10-alpine
          docker run -d \
            --name redis \
            -p 6379:6379 \
            redis:8-alpine

          # Wait for PostgreSQL
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U bambu &>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

          # Wait for Redis
          for i in $(seq 1 15); do
            if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            sleep 1
          done

      - name: Install dependencies
        run: npm install

      - name: Generate NEXTAUTH_SECRET
        run: echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application (E2E runs against a production build)
        # Next.js's own docs (node_modules/next/dist/docs/01-app/02-guides/testing/playwright.md)
        # recommend testing against `next build && next start`, not `next dev`,
        # to closely resemble real app behavior. This repo's E2E job used
        # `next dev` (via `npm run dev` → scripts/dev-with-lan.mjs) for the
        # full ~20-40min duration of each shard's run — investigated as the
        # likely root cause of AGENTS.md Known Issue #25 (broad, shard-wide,
        # unrelated-spec E2E failures with growing "N did not run" tails):
        # `next dev` does on-demand per-route compilation and keeps much more
        # in memory than a production build, which degrades under the
        # sustained real-browser load of hundreds of serial tests
        # (workers:1) on a 2-core CI runner. Build doesn't need a live DB —
        # verified locally: succeeds before Postgres/Redis are even started.
        run: npm run build

      - name: Copy static assets into standalone build
        # next.config.ts sets `output: 'standalone'`. With that config,
        # `next start` refuses to run ("next start does not work with
        # output: standalone — use node .next/standalone/server.js instead",
        # confirmed by actually running `next start` against this build).
        # The standalone server.js doesn't include `public/` or
        # `.next/static/` by default (meant for CDN-served assets in a real
        # deploy) — copy them in, per Next.js's own `output` doc.
        run: |
          cp -r public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/

      - name: Push schema to CI database
        run: npx prisma db push

      - name: Apply raw-SQL sequence migrations (not covered by db push)
        # `prisma db push` only syncs what's declared in schema.prisma. These
        # 3 migrations create Postgres sequences (factura_numero_seq,
        # abono_numero_seq, embarque_numero_seq, compra_insumo_numero_seq)
        # via raw SQL — db push never creates them, so getNextNumero() (used
        # by every pedido/venta-libre/recurrente/abono/compra creation) 500s
        # with `relation "..._seq" does not exist` on any CI-fresh database.
        # Root cause confirmed by reproducing e2e/offline-resilience.spec.ts
        # locally against a fresh db-push'd Postgres. The migration files
        # GRANT to `app_write`, which doesn't exist in this ephemeral
        # container (only the POSTGRES_USER superuser does) — create it
        # first so the migrations apply unmodified, same SQL as prod.
        run: |
          export PGPASSWORD=bambu_dev
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'app_write') THEN
                CREATE ROLE app_write;
              END IF;
            END \$\$;
          "
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260610_add_factura_numero_seq/migration.sql
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260611_add_abono_embarque_seqs/migration.sql
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260619_import_fase2_proveedor_compra_seq/migration.sql
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260817_plan_maestro_ledgers/migration.sql
          # 20260817 (arriba) crea ReceivableEntry_offlineId_key UNIQUE; esta
          # migración posterior lo baja a índice normal (bug pagar-fiado con
          # abonos que cubren 2+ pedidos). Se aplica acá para replicar el
          # orden de `prisma migrate deploy` de prod.
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260829_receivable_entry_offlineid_not_unique/migration.sql
          # ADR-CORRECCION-MONETARIA-001 g2.1 — CHECK + GRANT no expresables en schema.prisma.
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260901_add_correccion_abono/migration.sql
          # G5.5 — CHECK `chk_pedido_estadopago_proyectado`, no expresable en schema.prisma.
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260905_add_pedido_estadopago_check/migration.sql

      - name: Seed test data
        run: npx tsx prisma/seed-test.ts

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Los binarios de browser sí cachean (~200-400MB por run sin cache),
      # las libs de sistema (apt) NO — no hay forma de cachearlas entre VMs
      # efímeras de GitHub Actions, así que install-deps corre siempre.
      - name: Install Playwright browsers (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        # `install-deps` corre `apt-get update` internamente. La imagen de
        # `ubuntu-latest` trae pre-configurado el APT source de Google Chrome
        # (`dl.google.com/linux/chrome-stable`), que periódicamente sirve un
        # índice con `Hash Sum mismatch` y hace fallar TODO el `apt-get update`
        # (visto 2026-09-09: 3 corridas seguidas de CI muertas en este step).
        # Playwright usa su propio chromium descargado, no el Chrome del
        # sistema — el source de Google es irrelevante acá. Se remueve antes
        # de `install-deps` para que un incidente del CDN de Google no tumbe
        # el pipeline. Las libs de chromium (libnss3, libatk, …) vienen de los
        # repos de Ubuntu, no de Google.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install-deps chromium

      - name: Run Playwright tests (shard ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=html

      - name: Dump Postgres/Redis container logs and resource usage
        # Investigación de capacidad de CI (continuación de Known Issue #25):
        # runs-on: ubuntu-latest es 2 vCPU/7GB (docs.github.com/actions/using
        # -github-hosted-runners/about-github-hosted-runners), y el job corre
        # Postgres + Redis + el server Next.js + Chromium simultáneos en esa
        # misma máquina. Los contenedores se arrancan con `docker run -d` sin
        # ningún step que capture su stdout/stderr — hasta ahora, si Postgres
        # rechazaba conexiones o algún proceso moría por OOM, no quedaba
        # ningún rastro en el log de CI. `if: always()` (no solo on failure)
        # para poder comparar corridas sanas vs. degradadas.
        if: always()
        run: |
          echo "::group::docker stats (snapshot al final del run)"
          docker stats --no-stream || true
          echo "::endgroup::"
          echo "::group::free -h"
          free -h || true
          echo "::endgroup::"
          echo "::group::postgres container logs"
          docker logs postgres 2>&1 | tail -300 || true
          echo "::endgroup::"
          echo "::group::redis container logs"
          docker logs redis 2>&1 | tail -100 || true
          echo "::endgroup::"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # e2e-hub — soak del Pedido Hub V2 (Fase 10-C).
  #
  # Se ejecuta en push a `main` y en cada PR (validación de cambios) Y cada
  # 4h por `schedule` (soak temporal — mide estabilidad sostenida sin
  # depender del ritmo de merges). Es el ÚNICO job que corre en el cron: los
  # demás llevan `if: github.event_name != 'schedule'`.
  #
  # Job SEPARADO y transitorio: corre SOLO la suite del Hub con
  # NEXT_PUBLIC_PEDIDOS_V2=true, mientras el job `e2e` de arriba se mantiene
  # con el flag OFF y su suite legacy intacta. El objetivo es medir el soak
  # del Hub sin mezclarlo con las ~180 pruebas que dependen deliberadamente de
  # la UI legacy (ver docs/pedidos/fase-composicion-c4-edit-plan.md, gates
  # F10-2/F10-6). Se elimina en F10b, cuando las dos suites se fusionen y el
  # flag pase a default ON.
  #
  # Es una copia deliberada del job `e2e` (misma infra: contenedores, build de
  # producción standalone, migraciones raw-SQL, seed) — la duplicación es
  # aceptable para un job de vida corta y evita tocar el job legacy.
  # ───────────────────────────────────────────────────────────────────────────
  e2e-hub:
    name: E2E Hub (V2 ON)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      DATABASE_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      DIRECT_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      REDIS_URL: redis://localhost:6379
      AUTH_TRUST_HOST: 'true'
      TZ: America/Bogota
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3001
      # El flag: leído por el runner de Playwright (los `test.skip(!HUB_ON)`
      # de los specs) y por el build de abajo (Next.js lo inlinea).
      NEXT_PUBLIC_PEDIDOS_V2: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Start service containers (PostgreSQL + Redis)
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=bambu \
            -e POSTGRES_PASSWORD=bambu_dev \
            -e POSTGRES_DB=bambu \
            -p 5432:5432 \
            postgres:17.10-alpine
          docker run -d \
            --name redis \
            -p 6379:6379 \
            redis:8-alpine

          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U bambu &>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

          for i in $(seq 1 15); do
            if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            sleep 1
          done

      - name: Install dependencies
        run: npm install

      - name: Generate NEXTAUTH_SECRET
        run: echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application (V2 ON — el flag NEXT_PUBLIC_PEDIDOS_V2 se inlinea acá)
        # NEXT_PUBLIC_* se inlinea en build; el job-level env de arriba ya lo
        # provee, se repite acá de forma explícita para que el propósito del
        # job quede legible en el step.
        run: npm run build
        env:
          NEXT_PUBLIC_PEDIDOS_V2: 'true'

      - name: Copy static assets into standalone build
        run: |
          cp -r public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/

      - name: Push schema to CI database
        run: npx prisma db push

      - name: Apply raw-SQL sequence migrations (not covered by db push)
        run: |
          export PGPASSWORD=bambu_dev
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'app_write') THEN
                CREATE ROLE app_write;
              END IF;
            END \$\$;
          "
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260610_add_factura_numero_seq/migration.sql
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260611_add_abono_embarque_seqs/migration.sql
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260619_import_fase2_proveedor_compra_seq/migration.sql
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260817_plan_maestro_ledgers/migration.sql
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260829_receivable_entry_offlineid_not_unique/migration.sql
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260901_add_correccion_abono/migration.sql
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260905_add_pedido_estadopago_check/migration.sql

      - name: Seed test data
        run: npx tsx prisma/seed-test.ts

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        # Remover el APT source de Google Chrome antes de `install-deps` — ver
        # el mismo step del job `e2e` (fix #239): su CDN sirve índices con
        # `Hash Sum mismatch` que tumban `apt-get update`. Playwright usa su
        # propio chromium; el source es irrelevante.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install-deps chromium

      - name: Run Playwright tests (suite del Hub, V2 ON)
        # Solo los specs gated tras NEXT_PUBLIC_PEDIDOS_V2. Suite chica
        # (~40 tests) → sin sharding. `--project=chromium` (desktop): la
        # cobertura responsive del Hub tiene su propio test dedicado
        # (`responsive: desktop tabla / mobile tarjetas`); correr toda la
        # suite en viewport mobile además duplicaría el tiempo sin aportar
        # señal de soak. Cuando el flag esté ON en `e2e` (F10b) estos specs
        # se reintegran a la matriz general y este job se elimina.
        run: >
          npx playwright test --reporter=html --project=chromium
          e2e/pedidos-hub.spec.ts
          e2e/pedidos-hub-recurrentes.spec.ts
          e2e/pedidos-entrega-suficiencia.spec.ts
          e2e/pedidos-g11.spec.ts
          e2e/pedidos-peek-riesgo.spec.ts

      - name: Dump Postgres/Redis container logs and resource usage
        if: always()
        run: |
          echo "::group::docker stats"
          docker stats --no-stream || true
          echo "::endgroup::"
          echo "::group::free -h"
          free -h || true
          echo "::endgroup::"
          echo "::group::postgres container logs"
          docker logs postgres 2>&1 | tail -300 || true
          echo "::endgroup::"
          echo "::group::redis container logs"
          docker logs redis 2>&1 | tail -100 || true
          echo "::endgroup::"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hub
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-hub
          path: test-results/
          retention-days: 7
