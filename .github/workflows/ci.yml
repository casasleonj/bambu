name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pedidos_v2:
        # F10a-preflight (gate F10-6): permite correr la matriz `e2e` completa
        # (8 shards) con el Hub ON sobre cualquier ref, para comparar contra el
        # baseline de `main` (flag OFF) en el mismo commit. Default `false`:
        # push / pull_request / schedule no tienen `inputs` y el job `e2e`
        # sigue construyendo y corriendo exactamente igual que antes (flag OFF).
        description: 'Construir y correr el job e2e con NEXT_PUBLIC_PEDIDOS_V2=true'
        type: boolean
        default: false
  # El cron de soak del Hub V2 (cada 3h) se retiró (#703): su criterio de salida
  # (>=72h y >=18 ejecuciones verdes) venció el 2026-10-10 sin decisión y gastaba
  # minutos sin decidir nada. El job `e2e-hub` SE CONSERVA en push/PR porque
  # producción corre con NEXT_PUBLIC_PEDIDOS_V2=true y la matriz `e2e` prueba V2
  # OFF; su eliminación definitiva es F10b (#312). Para restaurar el soak, volver
  # a agregar un bloque `schedule` con cron.

permissions:
  contents: read

concurrency:
  # `github.event_name` en el grupo: una corrida programada (soak) y una
  # corrida de push a `main` (validación de cambio) NO deben cancelarse
  # entre sí — son señales distintas y ambas deben quedar registradas.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # detect-changes — política de CI por tipo de cambio (aprobada por el
  # equipo, 2026-09-13 — decisión de infraestructura independiente de
  # TERRITORIO-F2). El E2E completo (8 shards) es costoso (~15-25 min cada
  # uno) y no aporta señal cuando el diff no puede afectar comportamiento
  # ejecutable. Validado empíricamente contra 6 PRs históricos 100%
  # documentales (#153, #193, #202, #204, #234, #236): en los 6,
  # Type check+Tests/Lint/Integration pasaron y el E2E completo falló 8/8 —
  # mismo patrón crónico de infra ya documentado en Known Issues #20/#25,
  # nunca una regresión real atribuible al contenido.
  #
  # REGLA — allowlist explícita, NUNCA por extensión (un ".md" no es
  # automáticamente seguro; un archivo de config/workflow/contrato con esa
  # extensión SÍ debe forzar E2E):
  #   - docs/**    → cualquier archivo bajo este directorio
  #   - AGENTS.md  → instrucciones del agente, revisado explícitamente
  # Todo lo demás fuerza e2e_required=true SIN EXCEPCIÓN, incluida
  # cualquier otra ruta .md en la raíz del repo no listada acá a mano
  # (README.md, CLAUDE.md, *_REPORT.md, plan-maestro-*.md, etc. — auditados
  # el 2026-09-13, sin referencias desde src/**/scripts/**/config, pero
  # deliberadamente NO incluidos en esta iteración: la regla del equipo es
  # "clasificar explícitamente antes de incluir", no "incluir por defecto
  # porque parece inofensivo"). Si se agrega una nueva ruta puramente
  # documental, hay que sumarla a mano a ALLOWED_PREFIXES/ALLOWED_FILES más
  # abajo — nunca reemplazar esto por un patrón `*.md` genérico.
  #
  # Este job SIEMPRE corre (sin `if:` a nivel de job), en todos los eventos
  # — incluido `schedule`. Corrección 2026-09-13: una versión anterior tenía
  # `if: github.event_name != 'schedule'` acá, lo que lo saltaba en el cron
  # del soak. Un job downstream con `needs: detect-changes` se salta por
  # defecto si el job del que depende se saltó (salvo que su propio `if` lo
  # anule explícitamente) — así que ese `if` dejaba `needs.detect-changes.
  # outputs.e2e_required` vacío en `schedule`, contradiciendo el propósito
  # de esta clasificación. La lógica interna del step de abajo YA maneja
  # `schedule`/`push`/`workflow_dispatch` correctamente (primer `if` del
  # script: cualquier evento que no sea `pull_request` fuerza
  # `e2e_required=true` de inmediato) — el job solo necesitaba dejar de
  # saltarse a sí mismo para que esa rama se ejecutara. Sin esto, no hace
  # falta ninguna clasificación adicional ni una excepción nueva: es la
  # misma lógica de siempre, ahora sin el `if` que la desactivaba.
  #
  # Solo el bloque de `pull_request` de abajo evalúa el diff real (necesita
  # un base/head que comparar). Para `push`/`workflow_dispatch`/`schedule`
  # este job corre igual (es barato, ~8s) pero siempre resuelve
  # `e2e_required=true` sin mirar ningún diff — no hay "diff de PR" que
  # clasificar y `main` es la fuente de verdad del baseline.
  #
  # ADVERTENCIA para quien toque branch protection: NINGÚN "E2E (n/8)"
  # individual (ni el job `e2e` como grupo) debe marcarse como required
  # status check en `main` mientras este skip exista. Regla general
  # documentada por GitHub: un job saltado vía `if:` se reporta como
  # "skipped" y cuenta como "Success" para checks requeridos — así que en
  # principio un required check sobre un job saltado no bloquea el merge.
  # Pero con un job de **matrix** (como `e2e`), si se salta antes de
  # expandirse, los nombres de check individuales ("E2E (1/8)".."E2E (8/8)")
  # ni siquiera llegan a generarse como "skipped" — no existen en absoluto
  # para ese commit. Un required check configurado contra esos nombres
  # exactos dejaría cualquier PR docs-only colgado esperando un status que
  # nunca llega (comportamiento documentado: github.com/actions/runner/
  # issues/952). La política real, más simple, es la de arriba: ningún
  # "E2E (n/8)" individual debe ser required mientras este skip exista.
  # Verificado el 2026-09-13 que hoy NINGÚN "E2E (n/8)" es required (PR #249,
  # 8/8 en rojo, `mergeable_state` quedó en "unstable" — no "blocked" — que
  # es la semántica documentada de "check no-requerido en rojo" de la API de
  # GitHub, no un required check incumplido). Si en el futuro se necesita
  # que el E2E sea un gate obligatorio, hace falta un job-resumen que corra
  # siempre (incluso cuando el matrix se salta) y reporte un único nombre de
  # check estable — no marcar los legs del matrix individuales.
  # ───────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect change scope (docs-only vs. executable)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e_required: ${{ steps.classify.outputs.e2e_required }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify diff (docs-only vs. requires E2E)
        id: classify
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "e2e_required=true" >> "$GITHUB_OUTPUT"
            echo "No es un pull_request (evento: ${{ github.event_name }}) — el E2E completo siempre corre."
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # Tres puntos (`BASE...HEAD`): solo lo que ESTE PR cambió desde su ancestro común con
          # la base. Con dos puntos (`BASE HEAD`), si `main` avanzó después de ramar, el diff
          # incluye al revés los archivos de código de los PR mergeados entretanto y un PR
          # solo de documentación corría los 8 turnos de E2E (#547). Si el diff falla (sin
          # ancestro común), `CHANGED_FILES` queda vacío y se corre el E2E por seguridad.
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" 2>/dev/null || true)

          echo "Archivos modificados en este PR (base $BASE_SHA -> head $HEAD_SHA):"
          echo "$CHANGED_FILES"

          if [ -z "$CHANGED_FILES" ]; then
            echo "e2e_required=true" >> "$GITHUB_OUTPUT"
            echo "No se pudo calcular el diff (vacío) — el E2E completo corre por seguridad."
            exit 0
          fi

          ALLOWED_PREFIXES=("docs/")
          ALLOWED_FILES=("AGENTS.md")

          OUTSIDE_ALLOWLIST=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            MATCHED="false"
            for prefix in "${ALLOWED_PREFIXES[@]}"; do
              case "$file" in
                "$prefix"*) MATCHED="true" ;;
              esac
            done
            for allowed in "${ALLOWED_FILES[@]}"; do
              [ "$file" = "$allowed" ] && MATCHED="true"
            done
            if [ "$MATCHED" = "false" ]; then
              OUTSIDE_ALLOWLIST="$OUTSIDE_ALLOWLIST$file"$'\n'
            fi
          done <<< "$CHANGED_FILES"

          if [ -n "$OUTSIDE_ALLOWLIST" ]; then
            echo "e2e_required=true" >> "$GITHUB_OUTPUT"
            echo "Archivos fuera del allowlist docs-only (fuerzan E2E completo):"
            echo "$OUTSIDE_ALLOWLIST"
          else
            echo "e2e_required=false" >> "$GITHUB_OUTPUT"
            echo "Todo el diff cae dentro del allowlist docs-only (docs/**, AGENTS.md) — E2E completo omitido."
          fi

  quality:
    name: Type check + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # El cron cada 4h es exclusivamente para el soak del Hub (job `e2e-hub`).
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: |
          mkdir -p reports
          npm run test -- \
            --reporter=verbose \
            --reporter=junit \
            --outputFile.junit=reports/junit.xml 2>&1 | tee reports/test-output.log
          exit ${PIPESTATUS[0]}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/
          retention-days: 7

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint -- --max-warnings 999

  integration:
    name: Integration tests (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No bloquea merges todavía -- es la primera vez que este suite corre
    # en CI (antes solo se ejecutaba localmente contra Postgres real, si
    # el desarrollador lo hacía). Igual que Lint cuando se introdujo:
    # queda non-blocking hasta confirmar que el suite completo es estable
    # en un entorno de CI fresco, antes de promoverlo a gate obligatorio.
    continue-on-error: true
    if: github.event_name != 'schedule'

    env:
      DATABASE_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      DIRECT_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      REDIS_URL: redis://localhost:6379
      TZ: America/Bogota

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Start service containers (PostgreSQL + Redis)
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=bambu \
            -e POSTGRES_PASSWORD=bambu_dev \
            -e POSTGRES_DB=bambu \
            -p 5432:5432 \
            postgres:17.10-alpine
          docker run -d \
            --name redis \
            -p 6379:6379 \
            redis:8-alpine

          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U bambu &>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

          for i in $(seq 1 15); do
            if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            sleep 1
          done

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to CI database
        run: npx prisma db push

      - name: Apply raw-SQL sequence migrations (not covered by db push)
        # `prisma db push` no crea secuencias, CHECK, triggers ni pg_trgm. UNA sola lista
        # (scripts/migraciones-sql-crudas.txt) para CI y para desarrollo local (#714):
        # antes estaba copiada a mano en los jobs integration, e2e y e2e-hub.
        run: bash scripts/aplicar-migraciones-sql-crudas.sh

      - name: Run integration tests
        run: npm run test:integration

  e2e:
    name: E2E (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: detect-changes
    # Suite legacy (V2 OFF). `github.event_name != 'schedule'` es la
    # exclusión ORIGINAL de este job (previa a la política de skip
    # docs-only, sin relación con ella): el cron de 3h es exclusivamente el
    # soak de `e2e-hub` (más abajo) — la suite legacy de 8 shards nunca
    # corrió en `schedule`, para no pagar el costo completo de Playwright
    # cada 3h además del soak dedicado. `detect-changes.outputs.e2e_required`
    # es la política de skip para PRs docs-only — ver el comentario extenso
    # en ese job — y ahora es fiable en todo evento (2026-09-13: se corrigió
    # que `detect-changes` se saltaba a sí mismo en `schedule`, lo que
    # hubiera dejado este `needs.detect-changes.outputs...` vacío ahí; no
    # cambia nada en la práctica porque el `!= 'schedule'` de la izquierda ya
    # excluía `schedule` de todas formas, pero antes del fix dependía de dos
    # condiciones redundantes en vez de una sola fuente de verdad fiable).
    if: github.event_name != 'schedule' && needs.detect-changes.outputs.e2e_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    env:
      DATABASE_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      DIRECT_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      REDIS_URL: redis://localhost:6379
      AUTH_TRUST_HOST: 'true'
      TZ: America/Bogota
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3001
      # Vacío (= OFF) salvo `workflow_dispatch` con `pedidos_v2: true` (ver
      # `on.workflow_dispatch.inputs`). Lo leen el build (Next.js lo inlinea)
      # y el runner de Playwright (los `test.skip(!HUB_ON)` de los specs).
      NEXT_PUBLIC_PEDIDOS_V2: ${{ inputs.pedidos_v2 && 'true' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Start service containers (PostgreSQL + Redis)
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=bambu \
            -e POSTGRES_PASSWORD=bambu_dev \
            -e POSTGRES_DB=bambu \
            -p 5432:5432 \
            postgres:17.10-alpine
          docker run -d \
            --name redis \
            -p 6379:6379 \
            redis:8-alpine

          # Wait for PostgreSQL
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U bambu &>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

          # Wait for Redis
          for i in $(seq 1 15); do
            if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            sleep 1
          done

      - name: Install dependencies
        run: npm install

      - name: Generate NEXTAUTH_SECRET
        run: echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application (E2E runs against a production build)
        # Next.js's own docs (node_modules/next/dist/docs/01-app/02-guides/testing/playwright.md)
        # recommend testing against `next build && next start`, not `next dev`,
        # to closely resemble real app behavior. This repo's E2E job used
        # `next dev` (via `npm run dev` → scripts/dev-with-lan.mjs) for the
        # full ~20-40min duration of each shard's run — investigated as the
        # likely root cause of AGENTS.md Known Issue #25 (broad, shard-wide,
        # unrelated-spec E2E failures with growing "N did not run" tails):
        # `next dev` does on-demand per-route compilation and keeps much more
        # in memory than a production build, which degrades under the
        # sustained real-browser load of hundreds of serial tests
        # (workers:1) on a 2-core CI runner. Build doesn't need a live DB —
        # verified locally: succeeds before Postgres/Redis are even started.
        run: npm run build

      - name: Copy static assets into standalone build
        # next.config.ts sets `output: 'standalone'`. With that config,
        # `next start` refuses to run ("next start does not work with
        # output: standalone — use node .next/standalone/server.js instead",
        # confirmed by actually running `next start` against this build).
        # The standalone server.js doesn't include `public/` or
        # `.next/static/` by default (meant for CDN-served assets in a real
        # deploy) — copy them in, per Next.js's own `output` doc.
        run: |
          cp -r public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/

      - name: Push schema to CI database
        run: npx prisma db push

      - name: Apply raw-SQL sequence migrations (not covered by db push)
        # `prisma db push` no crea secuencias, CHECK, triggers ni pg_trgm. UNA sola lista
        # (scripts/migraciones-sql-crudas.txt) para CI y para desarrollo local (#714):
        # antes estaba copiada a mano en los jobs integration, e2e y e2e-hub.
        run: bash scripts/aplicar-migraciones-sql-crudas.sh

      - name: Seed test data
        run: npx tsx prisma/seed-test.ts

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Los binarios de browser sí cachean (~200-400MB por run sin cache),
      # las libs de sistema (apt) NO — no hay forma de cachearlas entre VMs
      # efímeras de GitHub Actions, así que install-deps corre siempre.
      - name: Install Playwright browsers (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        # `install-deps` corre `apt-get update` internamente. La imagen de
        # `ubuntu-latest` trae pre-configurado el APT source de Google Chrome
        # (`dl.google.com/linux/chrome-stable`), que periódicamente sirve un
        # índice con `Hash Sum mismatch` y hace fallar TODO el `apt-get update`
        # (visto 2026-09-09: 3 corridas seguidas de CI muertas en este step).
        # Playwright usa su propio chromium descargado, no el Chrome del
        # sistema — el source de Google es irrelevante acá. Se remueve antes
        # de `install-deps` para que un incidente del CDN de Google no tumbe
        # el pipeline. Las libs de chromium (libnss3, libatk, …) vienen de los
        # repos de Ubuntu, no de Google.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install-deps chromium

      - name: Run Playwright tests (shard ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=list,html

      - name: Dump Postgres/Redis container logs and resource usage
        # Investigación de capacidad de CI (continuación de Known Issue #25):
        # runs-on: ubuntu-latest es 2 vCPU/7GB (docs.github.com/actions/using
        # -github-hosted-runners/about-github-hosted-runners), y el job corre
        # Postgres + Redis + el server Next.js + Chromium simultáneos en esa
        # misma máquina. Los contenedores se arrancan con `docker run -d` sin
        # ningún step que capture su stdout/stderr — hasta ahora, si Postgres
        # rechazaba conexiones o algún proceso moría por OOM, no quedaba
        # ningún rastro en el log de CI. `if: always()` (no solo on failure)
        # para poder comparar corridas sanas vs. degradadas.
        if: always()
        run: |
          echo "::group::docker stats (snapshot al final del run)"
          docker stats --no-stream || true
          echo "::endgroup::"
          echo "::group::free -h"
          free -h || true
          echo "::endgroup::"
          echo "::group::postgres container logs"
          docker logs postgres 2>&1 | tail -300 || true
          echo "::endgroup::"
          echo "::group::redis container logs"
          docker logs redis 2>&1 | tail -100 || true
          echo "::endgroup::"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # e2e-hub — soak del Pedido Hub V2 (Fase 10-C).
  #
  # Se ejecuta en push a `main`, en cada PR y por `workflow_dispatch`. Ya no hay
  # cron de soak (#703); los `if: github.event_name != 'schedule'` de otros jobs
  # quedan como defensa por si se restaura.
  #
  # Job SEPARADO y transitorio: corre SOLO la suite del Hub con
  # NEXT_PUBLIC_PEDIDOS_V2=true, mientras el job `e2e` de arriba se mantiene
  # con el flag OFF y su suite legacy intacta. El objetivo es medir el soak
  # del Hub sin mezclarlo con las ~180 pruebas que dependen deliberadamente de
  # la UI legacy (ver docs/pedidos/fase-composicion-c4-edit-plan.md, gates
  # F10-2/F10-6). Se elimina en F10b, cuando las dos suites se fusionen y el
  # flag pase a default ON.
  #
  # Es una copia deliberada del job `e2e` (misma infra: contenedores, build de
  # producción standalone, migraciones raw-SQL, seed) — la duplicación es
  # aceptable para un job de vida corta y evita tocar el job legacy.
  # ───────────────────────────────────────────────────────────────────────────
  e2e-hub:
    name: E2E Hub (V2 ON)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      DATABASE_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      DIRECT_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      REDIS_URL: redis://localhost:6379
      AUTH_TRUST_HOST: 'true'
      TZ: America/Bogota
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3001
      # El flag: leído por el runner de Playwright (los `test.skip(!HUB_ON)`
      # de los specs) y por el build de abajo (Next.js lo inlinea).
      NEXT_PUBLIC_PEDIDOS_V2: 'true'
      # #656: verificar también el recorrido real de la parcial fiada.
      FIADO_ENTREGA_PARCIAL: 'true'
      # P2-2 (#463): «Entregar después» en la venta rápida del Hub (el servidor
      # también lo lee al crear). Solo este job lo enciende; `e2e` no cambia.
      NEXT_PUBLIC_VENTA_RUTA_ENTREGA_POSTERIOR: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Start service containers (PostgreSQL + Redis)
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=bambu \
            -e POSTGRES_PASSWORD=bambu_dev \
            -e POSTGRES_DB=bambu \
            -p 5432:5432 \
            postgres:17.10-alpine
          docker run -d \
            --name redis \
            -p 6379:6379 \
            redis:8-alpine

          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U bambu &>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

          for i in $(seq 1 15); do
            if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            sleep 1
          done

      - name: Install dependencies
        run: npm install

      - name: Generate NEXTAUTH_SECRET
        run: echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application (V2 ON — el flag NEXT_PUBLIC_PEDIDOS_V2 se inlinea acá)
        # NEXT_PUBLIC_* se inlinea en build; el job-level env de arriba ya lo
        # provee, se repite acá de forma explícita para que el propósito del
        # job quede legible en el step.
        run: npm run build
        env:
          NEXT_PUBLIC_PEDIDOS_V2: 'true'
          NEXT_PUBLIC_VENTA_RUTA_ENTREGA_POSTERIOR: 'true'

      - name: Copy static assets into standalone build
        run: |
          cp -r public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/

      - name: Push schema to CI database
        run: npx prisma db push

      - name: Apply raw-SQL sequence migrations (not covered by db push)
        # `prisma db push` no crea secuencias, CHECK, triggers ni pg_trgm. UNA sola lista
        # (scripts/migraciones-sql-crudas.txt) para CI y para desarrollo local (#714):
        # antes estaba copiada a mano en los jobs integration, e2e y e2e-hub.
        run: bash scripts/aplicar-migraciones-sql-crudas.sh

      - name: Seed test data
        run: npx tsx prisma/seed-test.ts

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        # Remover el APT source de Google Chrome antes de `install-deps` — ver
        # el mismo step del job `e2e` (fix #239): su CDN sirve índices con
        # `Hash Sum mismatch` que tumban `apt-get update`. Playwright usa su
        # propio chromium; el source es irrelevante.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install-deps chromium

      - name: Run Playwright tests (suite del Hub, V2 ON)
        # Solo los specs gated tras NEXT_PUBLIC_PEDIDOS_V2. Suite chica
        # (~40 tests) → sin sharding. `--project=chromium` (desktop): la
        # cobertura responsive del Hub tiene su propio test dedicado
        # (`responsive: desktop tabla / mobile tarjetas`); correr toda la
        # suite en viewport mobile además duplicaría el tiempo sin aportar
        # señal de soak. Cuando el flag esté ON en `e2e` (F10b) estos specs
        # se reintegran a la matriz general y este job se elimina.
        run: >
          npx playwright test --reporter=html --project=chromium
          e2e/pedidos-hub.spec.ts
          e2e/pedidos-hub-recurrentes.spec.ts
          e2e/pedidos-entrega-suficiencia.spec.ts
          e2e/pedidos-g11.spec.ts
          e2e/pedidos-peek-riesgo.spec.ts
          e2e/parciales-proyecciones-656.spec.ts
          e2e/pedidos-entregas-historicas-763.spec.ts

      - name: Dump Postgres/Redis container logs and resource usage
        if: always()
        run: |
          echo "::group::docker stats"
          docker stats --no-stream || true
          echo "::endgroup::"
          echo "::group::free -h"
          free -h || true
          echo "::endgroup::"
          echo "::group::postgres container logs"
          docker logs postgres 2>&1 | tail -300 || true
          echo "::endgroup::"
          echo "::group::redis container logs"
          docker logs redis 2>&1 | tail -100 || true
          echo "::endgroup::"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hub
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-hub
          path: test-results/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # ci-gate — check-resumen estable (#703). Corre SIEMPRE (`if: always()`) y
  # solo pasa si las validaciones exigidas realmente pasaron: un job omitido,
  # cancelado o ausente NO cuenta como éxito (GitHub reporta `skipped` como
  # verde para checks requeridos; aquí se trata como falla, salvo el E2E de un
  # PR solo de documentación, que `detect-changes` omite a propósito).
  # Exige: detect-changes, quality (tsc + unit) y e2e-hub en `success`, y el
  # E2E de 8 turnos en `success` cuando `e2e_required == 'true'`.
  # `lint` e `integration` son informativos (continue-on-error) y solo se listan.
  # NO está marcado como required en `main`: eso es decisión del PO (ver
  # docs/ci/GATES.md).
  # ───────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI gate (resumen)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [detect-changes, quality, e2e, e2e-hub, lint, integration]
    steps:
      - name: Evaluar resultados exigidos
        env:
          R_DETECT: ${{ needs.detect-changes.result }}
          R_QUALITY: ${{ needs.quality.result }}
          R_E2E: ${{ needs.e2e.result }}
          R_HUB: ${{ needs.e2e-hub.result }}
          R_LINT: ${{ needs.lint.result }}
          R_INTEGRATION: ${{ needs.integration.result }}
          E2E_REQUIRED: ${{ needs.detect-changes.outputs.e2e_required }}
        run: |
          fail=0
          check() { # nombre resultado esperado-descripcion
            if [ "$2" != "success" ]; then
              echo "::error::$1: $2 (se esperaba success)"
              fail=1
            else
              echo "OK   $1: success"
            fi
          }
          check "detect-changes" "$R_DETECT"
          check "quality (tsc + unit)" "$R_QUALITY"
          check "e2e-hub (V2 ON)" "$R_HUB"
          if [ "$E2E_REQUIRED" = "true" ]; then
            check "e2e (8 turnos)" "$R_E2E"
          elif [ "$E2E_REQUIRED" = "false" ] && [ "$R_E2E" = "skipped" ]; then
            echo "OK   e2e: omitido (el diff es solo documentación, allowlist de detect-changes)"
          else
            echo "::error::e2e: resultado '$R_E2E' con e2e_required='$E2E_REQUIRED' no es interpretable como éxito"
            fail=1
          fi
          echo "INFO lint (informativo): $R_LINT"
          echo "INFO integration (informativo): $R_INTEGRATION"
          exit $fail
