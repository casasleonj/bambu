name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: |
          mkdir -p reports
          npm run test -- \
            --reporter=verbose \
            --reporter=junit \
            --outputFile.junit=reports/junit.xml 2>&1 | tee reports/test-output.log
          exit ${PIPESTATUS[0]}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/
          retention-days: 7

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint -- --max-warnings 999

  e2e:
    name: E2E (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    env:
      DATABASE_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      DIRECT_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      REDIS_URL: redis://localhost:6379
      AUTH_TRUST_HOST: 'true'
      TZ: America/Bogota
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Start service containers (PostgreSQL + Redis)
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=bambu \
            -e POSTGRES_PASSWORD=bambu_dev \
            -e POSTGRES_DB=bambu \
            -p 5432:5432 \
            postgres:17.10-alpine
          docker run -d \
            --name redis \
            -p 6379:6379 \
            redis:8-alpine

          # Wait for PostgreSQL
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U bambu &>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

          # Wait for Redis
          for i in $(seq 1 15); do
            if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            sleep 1
          done

      - name: Install dependencies
        run: npm install

      - name: Generate NEXTAUTH_SECRET
        run: echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to CI database
        run: npx prisma db push

      - name: Seed test data
        run: npx tsx prisma/seed-test.ts

      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (shard ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
