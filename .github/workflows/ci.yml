name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: |
          mkdir -p reports
          npm run test -- \
            --reporter=verbose \
            --reporter=junit \
            --outputFile.junit=reports/junit.xml 2>&1 | tee reports/test-output.log
          exit ${PIPESTATUS[0]}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/
          retention-days: 7

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint -- --max-warnings 999

  e2e:
    name: E2E (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # TEMPORALMENTE DESACTIVADO -- pedido explícito del usuario (2026-08-20)
    # mientras dure la limpieza de deuda de lint (Fase 0 del plan de
    # convergencia, ~491 issues restantes tras PR #78). Los 8 shards vienen
    # fallando de forma consistente en 3 PRs seguidas (#76, #77, #78) con la
    # MISMA causa raíz ya diagnosticada y documentada en cada PR: fallos
    # amplios y sin relación entre sí (roles-permisos, race-conditions,
    # security-fixes/pagar-fiado-rbac, offline-sync, user-flow) -- capacidad/
    # timeout de CI, no relacionado a ningún diff de lint. Esperar el run
    # completo (~25-30min x 8 shards) en cada incremento de lint no aporta
    # señal nueva. REVERTIR este `if: false` en cuanto la deuda de lint esté
    # resuelta -- no dejarlo desactivado permanentemente.
    if: false
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    env:
      DATABASE_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      DIRECT_URL: postgresql://bambu:bambu_dev@localhost:5432/bambu
      REDIS_URL: redis://localhost:6379
      AUTH_TRUST_HOST: 'true'
      TZ: America/Bogota
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Start service containers (PostgreSQL + Redis)
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=bambu \
            -e POSTGRES_PASSWORD=bambu_dev \
            -e POSTGRES_DB=bambu \
            -p 5432:5432 \
            postgres:17.10-alpine
          docker run -d \
            --name redis \
            -p 6379:6379 \
            redis:8-alpine

          # Wait for PostgreSQL
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U bambu &>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

          # Wait for Redis
          for i in $(seq 1 15); do
            if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            sleep 1
          done

      - name: Install dependencies
        run: npm install

      - name: Generate NEXTAUTH_SECRET
        run: echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to CI database
        run: npx prisma db push

      - name: Apply raw-SQL sequence migrations (not covered by db push)
        # `prisma db push` only syncs what's declared in schema.prisma. These
        # 3 migrations create Postgres sequences (factura_numero_seq,
        # abono_numero_seq, embarque_numero_seq, compra_insumo_numero_seq)
        # via raw SQL — db push never creates them, so getNextNumero() (used
        # by every pedido/venta-libre/recurrente/abono/compra creation) 500s
        # with `relation "..._seq" does not exist` on any CI-fresh database.
        # Root cause confirmed by reproducing e2e/offline-resilience.spec.ts
        # locally against a fresh db-push'd Postgres. The migration files
        # GRANT to `app_write`, which doesn't exist in this ephemeral
        # container (only the POSTGRES_USER superuser does) — create it
        # first so the migrations apply unmodified, same SQL as prod.
        run: |
          export PGPASSWORD=bambu_dev
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'app_write') THEN
                CREATE ROLE app_write;
              END IF;
            END \$\$;
          "
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260610_add_factura_numero_seq/migration.sql
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260611_add_abono_embarque_seqs/migration.sql
          psql -h localhost -U bambu -d bambu -v ON_ERROR_STOP=1 -f prisma/migrations/20260619_import_fase2_proveedor_compra_seq/migration.sql

      - name: Seed test data
        run: npx tsx prisma/seed-test.ts

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Los binarios de browser sí cachean (~200-400MB por run sin cache),
      # las libs de sistema (apt) NO — no hay forma de cachearlas entre VMs
      # efímeras de GitHub Actions, así que install-deps corre siempre.
      - name: Install Playwright browsers (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Run Playwright tests (shard ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
