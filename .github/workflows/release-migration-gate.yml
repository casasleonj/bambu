# #703 R0: produce el check único "Production migration gate" para CADA push a main.
# Este check NO se exige en Vercel hasta validar el PR y activarlo explícitamente
# en Deployment Checks junto a "CI gate (resumen)". Sin escritura en BD ni deploy.
name: Production migration gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-migration-gate.yml'
      - 'scripts/ci/release-migration-gate.mjs'
      - 'scripts/ci/release-migration-policy.mjs'
      - 'scripts/ci/__tests__/release-migration-gate.node.test.mjs'
      - 'scripts/ci/__tests__/release-migration-policy.node.test.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  policy-tests:
    name: Production migration policy tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: >-
          node --test scripts/ci/__tests__/release-migration-gate.node.test.mjs
          scripts/ci/__tests__/release-migration-policy.node.test.mjs

  release-migration:
    name: Production migration gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identificar cambios de Prisma o migraciones SQL entre commits
        id: schema-diff
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$BEFORE" =~ ^[a-f0-9]{40}$ && "$AFTER" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::SHAs inválidos para clasificación"
            exit 1
          fi
          if ! git cat-file -e "$BEFORE^{commit}" || ! git cat-file -e "$AFTER^{commit}"; then
            echo "::error::No es posible obtener el diff de main. Fail closed."
            exit 1
          fi
          # El manifiesto SQL crudo es SOLO para tests y desarrollo (ver
          # scripts/aplicar-migraciones-sql-crudas.sh). Production aplica
          # prisma/migrations/** mediante prisma migrate deploy; evitar
          # bloquear prod por un cambio de fixtures de CI.
          set +e
          git diff --quiet "$BEFORE" "$AFTER" -- prisma/schema.prisma
          schema_rc=$?
          set -e
          case "$schema_rc" in
            0) echo "schema_changed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "schema_changed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::No se pudo clasificar schema Prisma ($schema_rc)"; exit 1 ;;
          esac
          # --no-renames hace que un rename incluya la baja de la ruta vieja:
          # no permite ocultar modificación de una migración histórica.
          git diff --name-status --no-renames -z "$BEFORE" "$AFTER" -- \
            prisma/migrations/ > "$RUNNER_TEMP/prisma-migrations.diff"
          # El analizador SOLO acepta archivos migration.sql nuevos: modificar,
          # eliminar o renombrar migraciones ya presentes no certifica esquema.
          new_count="$(node scripts/ci/release-migration-policy.mjs < "$RUNNER_TEMP/prisma-migrations.diff")"
          echo "new_migrations=$new_count" >> "$GITHUB_OUTPUT"
      - name: Comprobar resultado de migrate-deploy.yml para el SHA exacto
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCHEMA_CHANGED: ${{ steps.schema-diff.outputs.schema_changed }}
          NEW_MIGRATIONS: ${{ steps.schema-diff.outputs.new_migrations }}
        run: node scripts/ci/release-migration-gate.mjs
