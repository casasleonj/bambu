name: Diagnose Vercel production credentials (read-only)

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnose:
    name: Vercel token and production environment access
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      # No checkout, project dependencies, application build, or database access.
      - name: Install pinned CLI without production credentials
        run: npm install --global vercel@66.6.0 --no-audit --no-fund

      - name: Verify token and production environment access without exposing values
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Ml9rVX2uWgNn2OJ8cZe9pTWD
          VERCEL_PROJECT_ID: prj_NzjF7gJ1CFYYHOhfAhE5mK7CxpPr
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::error::VERCEL_TOKEN ausente en GitHub Actions"
            exit 1
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          cd "$tmp"
          if ! vercel whoami --format json >"$tmp/auth.log" 2>&1; then
            echo "::error::Vercel rechazó autenticación o no está disponible"
            exit 1
          fi
          if ! vercel env pull --environment=production --yes "$tmp/production.env" >"$tmp/pull.log" 2>&1; then
            echo "::error::No fue posible leer el entorno de producción del proyecto"
            exit 1
          fi
          node --input-type=module - "$tmp/production.env" <<'NODE'
          import { readFileSync } from 'node:fs'
          import { parseEnv } from 'node:util'
          try {
            const vars = parseEnv(readFileSync(process.argv[2], 'utf8'))
            for (const key of ['DATABASE_URL', 'DIRECT_URL']) {
              const u = new URL(vars[key])
              const ref = 'wdttkrlbpcawulaaiapj'
              const user = decodeURIComponent(u.username)
              const direct = u.hostname === 'db.' + ref + '.supabase.co' && user === 'postgres'
              const pooler = u.hostname.endsWith('.pooler.supabase.com') && user === 'postgres.' + ref
              if (!['postgres:', 'postgresql:'].includes(u.protocol) ||
                  !u.password || u.pathname !== '/postgres' || u.hash || !(direct || pooler)) {
                throw new Error('invalid destination')
              }
            }
            console.log('Autenticación y acceso al entorno de producción verificados; destino Supabase esperado.')
          } catch {
            console.error('::error::Variables de conexión ausentes o destino no autorizado')
            process.exitCode = 1
          }
          NODE
