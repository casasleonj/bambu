name: Apply Prisma migrations to production

on:
  push:
    branches:
      - main
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      # Si cambia el orquestador, debe ejecutarse para certificar el SHA.
      # El release gate invalida el éxito anterior del pipeline.
      - '.github/workflows/migrate-deploy.yml'
      - 'scripts/ci/migration-ledger-preflight.mjs'
      - 'scripts/ci/migration-ledger-recover.mjs'
      - '.github/workflows/migrate-recover.yml'
      - 'scripts/ci/release-migration-policy.mjs'
      - 'scripts/ci/verify-vercel-prod-env.mjs'
      - 'scripts/ci/verify-vercel-project-access.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prisma-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Deploy database migrations
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # FIX 2026-09-14: DATABASE_URL/DIRECT_URL nunca existieron como secrets
      # de GitHub (ni a nivel repo ni del entorno Production) — este job
      # fallaba en "Check pending migrations" con P1012 ("DIRECT_URL resolvió
      # a un string vacío") desde que existe. Consecuencia real: la migración
      # de F2 (PedidoExcepcionCredito, User.puedeAutorizarExcepcionCredito)
      # nunca se aplicó a Supabase, y el login de producción se rompió para
      # TODOS los usuarios (prisma.user.findUnique() sin `select` pedía una
      # columna inexistente). Fix: en vez de duplicar las credenciales de la
      # base como secrets separados (riesgo de desincronización — exactamente
      # lo que pasó), este job las trae en vivo desde Vercel (única fuente de
      # verdad) con `vercel env pull`, autenticado con un VERCEL_TOKEN.
      - name: Install Vercel CLI (versión exacta revisada)
        run: npm i -g vercel@66.6.0

      # #1015: `vercel whoami` consulta el endpoint de USUARIO y devuelve
      # "User not found" con tokens de alcance team, aunque el token acceda al
      # proyecto. Se verifica en cambio el acceso al proyecto y team EXACTOS
      # (API de proyecto; id y accountId deben coincidir). Fail closed, sin
      # imprimir token, cuerpos de respuesta ni datos de cuenta.
      - name: Verificar acceso de VERCEL_TOKEN al proyecto y team
        run: node scripts/ci/verify-vercel-project-access.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Ml9rVX2uWgNn2OJ8cZe9pTWD
          VERCEL_PROJECT_ID: prj_NzjF7gJ1CFYYHOhfAhE5mK7CxpPr

      - name: Pull production env vars from Vercel
        run: |
          vercel env pull --environment=production --yes .env.vercel-production || {
            echo "::error::vercel env pull falló. El paso anterior ya verificó acceso al proyecto/team por API; si falló solo aquí, el token puede carecer de permiso para leer variables de entorno de producción (alcance del token). Generar uno nuevo en https://vercel.com/account/tokens (cuenta con acceso al team) y actualizarlo en Settings -> Secrets and variables -> Actions -> VERCEL_TOKEN de este repo."
            exit 1
          }
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # .vercel/project.json está en .gitignore (convención estándar de
          # Vercel CLI, nunca se comitea) — el runner de CI no tiene con qué
          # "linkear" el proyecto sin esto. projectId/orgId NO son secretos
          # (son identificadores, no credenciales), por eso van en claro acá
          # en vez de como secret.
          VERCEL_ORG_ID: team_Ml9rVX2uWgNn2OJ8cZe9pTWD
          VERCEL_PROJECT_ID: prj_NzjF7gJ1CFYYHOhfAhE5mK7CxpPr

      - name: Validar identidad de Supabase y exportar credenciales
        run: |
          set -euo pipefail
          trap 'rm -f .env.vercel-production' EXIT
          node scripts/ci/verify-vercel-prod-env.mjs .env.vercel-production

      - name: Generate Prisma Client
        run: npx prisma generate

      # `prisma migrate status` sale con código 1 cuando SÍ hay migraciones
      # pendientes — es su comportamiento normal, no un error (literalmente
      # así se detecta "hay algo para aplicar"). Como paso bloqueante ANTES
      # de "Apply pending migrations" esto hacía fallar el job en el caso
      # exitoso real (migraciones nuevas por aplicar), nunca llegaba a
      # aplicarlas. Se deja como diagnóstico informativo (`|| true`); quien
      # decide si hay un problema real es el paso siguiente.
      - name: Check pending migrations (informativo, no bloqueante)
        run: npx prisma migrate status || true

      - name: Conciliar checksum e historial de migraciones ANTES de DDL
        id: preflight
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/ci/migration-ledger-preflight.mjs

      # Fail closed: ausencia de output, error de preflight o dispatch manual
      # jamás habilitan este paso. Solo se aplica DDL si la conciliación
      # detectó migraciones SQL NUEVAS y aún pendientes en este push.
      - name: Apply pending migrations
        if: github.event_name == 'push' && steps.preflight.outputs.apply_pending == 'true'
        run: npx prisma migrate deploy

      # Un exit 0 de Prisma no sustituye la verificación del ledger final.
      # Incluso si no había pendientes, el certificado exige conciliación completa.
      - name: Conciliar ledger final (solo lectura)
        run: node scripts/ci/migration-ledger-preflight.mjs --postflight

  # Optional: uncomment and configure if you want GitHub Actions to also trigger
  # the Vercel deployment instead of relying solely on Vercel's Git integration.
  # Requires VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets.
  #
  # deploy:
  #   name: Deploy to Vercel
  #   needs: migrate
  #   runs-on: ubuntu-latest
  #   environment: production
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #     - name: Install Vercel CLI
  #       run: npm i -g vercel@latest
  #     - name: Pull Vercel environment
  #       run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
  #     - name: Build on Vercel
  #       run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
  #     - name: Deploy to Vercel
  #       run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
