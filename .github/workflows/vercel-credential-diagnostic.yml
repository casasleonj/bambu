name: Vercel credential diagnostic
on:
  push:
    branches: [ci/703-r0-migration-release-gate-20261122]
    paths: ['.github/workflows/vercel-credential-diagnostic.yml']
permissions: {}
jobs:
  verify:
    if: github.ref == 'refs/heads/ci/703-r0-migration-release-gate-20261122'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify authentication and project access (read only)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request, urllib.error, json
          token = os.environ.get("VERCEL_TOKEN", "")
          if not token:
              raise SystemExit("Missing VERCEL_TOKEN")
          for label, url in [
              ("Project access", "https://api.vercel.com/v9/projects/prj_NzjF7gJ1CFYYHOhfAhE5mK7CxpPr?teamId=team_Ml9rVX2uWgNn2OJ8cZe9pTWD")
          ]:
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      data = json.load(response)
                      if label == "Project access" and data.get("id") != "prj_NzjF7gJ1CFYYHOhfAhE5mK7CxpPr":
                          raise SystemExit("Unexpected project identity")
                      print(label + ": OK")
              except urllib.error.HTTPError as error:
                  raise SystemExit(label + ": HTTP " + str(error.code))
          PY
