name: CI nightly and dedup observation

on:
  schedule:
    # 02:17 America/Bogota, deliberately off the top of the hour.
    - cron: '17 7 * * 0,2-6'
    - cron: '17 7 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/ci-nightly.yml'
      - '.github/workflows/ci.yml'
      - 'scripts/ci/reuso-ci.mjs'
      - 'scripts/ci/__tests__/reuso-ci.node.test.mjs'
      - 'scripts/ci/reporte-nocturno.mjs'
      - 'scripts/ci/__tests__/reporte-nocturno.node.test.mjs'
      - '.github/workflows/ci-nightly-report.yml'

permissions:
  contents: read

concurrency:
  group: ci-nightly-policy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  policy-tests:
    name: Nightly policy tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/ci/__tests__/reuso-ci.node.test.mjs scripts/ci/__tests__/reporte-nocturno.node.test.mjs

  # Explicit, read-only validation of the real reusable suite from an internal PR.
  # Label only ADDS tests; the regular CI cannot be skipped with it.
  validate-reusable:
    name: Nightly validation (isolated PR)
    needs: policy-tests
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ci-nightly-validation' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      nightly_full: true
      pedidos_v2: false

  plan:
    name: Nightly decision (read-only)
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      run_full: ${{ steps.plan.outputs.run_full }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/ci/__tests__/reuso-ci.node.test.mjs
      - name: Check original evidence
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHT_SCHEDULE: ${{ github.event.schedule }}
          NIGHT_DECISION_FILE: ${{ runner.temp }}/nightly-decision.json
        run: node scripts/ci/reuso-ci.mjs
      - name: Preserve evidence of decision
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-decision.json
          if-no-files-found: error
          retention-days: 30

  regression:
    name: Regression full
    needs: plan
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.plan.outputs.run_full == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      nightly_full: true
      pedidos_v2: false

  summary:
    name: Nightly result (not a release gate)
    if: always() && github.event_name != 'pull_request'
    needs: [plan, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate decision and execution
        env:
          EVENT: ${{ github.event_name }}
          PLAN: ${{ needs.plan.result }}
          FULL: ${{ needs.plan.outputs.run_full }}
          REASON: ${{ needs.plan.outputs.reason }}
          RESULT: ${{ needs.regression.result }}
        run: |
          set -eu
          if [ "$PLAN" != success ]; then echo '::error::Decision failed'; exit 1; fi
          if [ "$EVENT" = push ]; then
            if [ "$FULL" != false ] || [ "$RESULT" != skipped ]; then echo '::error::Invalid shadow decision'; exit 1; fi
            echo 'Only shadow observation; regular CI unchanged.'
          elif [ "$FULL" = true ]; then
            if [ "$RESULT" != success ]; then echo '::error::Nightly full regression did not pass'; exit 1; fi
            echo 'Full regression completed.'
          elif [ "$EVENT" = schedule ] && [ "$FULL" = false ] && [ "$REASON" = fresh-exact-main-full ] && [ "$RESULT" = skipped ]; then
            echo 'Nightly reused recent exact-main full evidence; not a new certification.'
          else
            echo '::error::Invalid or missing decision/execution'; exit 1
          fi
